<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
    background: #1B3A5C;
  }
  .card {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #1B3A5C 0%, #0d2238 55%, #0a1a2e 100%);
    display: flex; align-items: stretch; position: relative; overflow: hidden;
  }
  /* Decorative grid lines */
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(200,168,75,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,168,75,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Gold accent bar left */
  .accent-bar { width: 8px; background: linear-gradient(180deg, #C8A84B, #e8c86a, #C8A84B); flex-shrink: 0; }

  .content {
    flex: 1; padding: 64px 72px; display: flex; flex-direction: column;
    justify-content: center; position: relative; z-index: 1;
  }

  .eyebrow {
    font-family: Arial, sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: #C8A84B; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .eyebrow::before {
    content: ''; display: inline-block; width: 32px; height: 2px; background: #C8A84B;
  }

  h1 {
    font-size: 68px; font-weight: 700; color: #fff; line-height: 1.1;
    margin-bottom: 28px; text-wrap: balance; max-width: 680px;
  }
  h1 em { color: #C8A84B; font-style: normal; }

  .tagline {
    font-family: Arial, sans-serif;
    font-size: 22px; color: rgba(255,255,255,0.72); line-height: 1.5;
    max-width: 580px; margin-bottom: 48px;
  }

  .badges {
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .badge-pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1.5px solid rgba(200,168,75,0.5);
    border-radius: 999px; padding: 8px 20px;
    font-family: Arial, sans-serif;
    font-size: 15px; font-weight: 700; color: #C8A84B;
    letter-spacing: 0.04em;
  }
  .badge-pill svg { flex-shrink: 0; }

  /* CEA shield badge right side */
  .shield-wrap {
    display: flex; align-items: center; justify-content: center;
    padding: 0 80px; flex-shrink: 0; position: relative; z-index: 1;
  }
  .shield-glow {
    position: absolute;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(200,168,75,0.18) 0%, transparent 70%);
  }

  .logo-row {
    position: absolute; bottom: 48px; left: 80px;
    display: flex; align-items: center; gap: 14px;
    font-family: Arial, sans-serif;
    font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.6);
    z-index: 1;
  }
  .domain { font-size: 15px; color: rgba(200,168,75,0.7); margin-left: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="accent-bar"></div>
  <div class="content">
    <div class="eyebrow">Property Listing Platform</div>
    <h1>List Your Property.<br><em>Trusted. Verified.</em></h1>
    <p class="tagline">Title-checked listings. Escrow-protected payouts.<br>Free for our first 100 verified properties.</p>
    <div class="badges">
      <div class="badge-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>
        Title Checked
      </div>
      <div class="badge-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Escrow Protected
      </div>
      <div class="badge-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>
        CEA Verified Badge
      </div>
    </div>
    <div class="logo-row">
      Castlerock Econetwork Africa
      <span class="domain">ceagroup.org</span>
    </div>
  </div>
  <div class="shield-wrap">
    <div class="shield-glow"></div>
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="224" viewBox="0 0 76 84">
      <defs>
        <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1B3A5C"/>
          <stop offset="100%" stop-color="#0d2238"/>
        </linearGradient>
      </defs>
      <path d="M38 2 L70 14 L70 46 C70 64 38 82 38 82 C38 82 6 64 6 46 L6 14 Z" fill="url(#sg)"/>
      <path d="M38 2 L70 14 L70 46 C70 64 38 82 38 82 C38 82 6 64 6 46 L6 14 Z" fill="none" stroke="#C8A84B" stroke-width="2"/>
      <path d="M38 10 L63 20 L63 46 C63 60 38 74 38 74 C38 74 13 60 13 46 L13 20 Z" fill="none" stroke="rgba(200,168,75,0.3)" stroke-width="0.75"/>
      <text x="22" y="24" text-anchor="middle" font-size="7" fill="rgba(200,168,75,0.5)">✦</text>
      <text x="54" y="24" text-anchor="middle" font-size="7" fill="rgba(200,168,75,0.5)">✦</text>
      <text x="38" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="900" fill="#C8A84B" letter-spacing="2">CEA</text>
      <polyline points="25,50 33,58 51,42" fill="none" stroke="#C8A84B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="1.8">VERIFIED</text>
    </svg>
  </div>
</div>
</body>
</html>
